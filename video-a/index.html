<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<title>PANOPRO — Od skenu k výkresům</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face { font-family: "Barlow"; font-style: normal; font-weight: 400; src: url("capture/assets/fonts/barlow-400.ttf") format("truetype"); }
  @font-face { font-family: "Barlow"; font-style: normal; font-weight: 500; src: url("capture/assets/fonts/barlow-500.ttf") format("truetype"); }
  @font-face { font-family: "Barlow"; font-style: normal; font-weight: 700; src: url("capture/assets/fonts/barlow-700.ttf") format("truetype"); }
  @font-face { font-family: "Barlow"; font-style: normal; font-weight: 800; src: url("capture/assets/fonts/barlow-800.ttf") format("truetype"); }
  @font-face { font-family: "Barlow"; font-style: normal; font-weight: 900; src: url("capture/assets/fonts/barlow-900.ttf") format("truetype"); }
  @font-face { font-family: "Open Sans"; font-style: normal; font-weight: 400; src: url("capture/assets/fonts/memSYaGs126MiZpBA-UvWbX2vVnXBbObj2OVZyOOSr4dVJWUgsjZ0B4gaVc.ttf") format("truetype"); }

  body { background: #111; }

  #video {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: "Barlow", "Open Sans", sans-serif;
    color: #ffffff;
  }

  .beat {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    overflow: hidden;
  }
  #b01 { opacity: 1; }

  .cam {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
  }

  /* ---------- shared ---------- */
  .grid-overlay {
    position: absolute;
    inset: -120px;
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 84px 84px;
    pointer-events: none;
  }
  .dots-overlay {
    position: absolute;
    inset: -120px;
    background-image: radial-gradient(rgba(255,255,255,0.10) 1.6px, transparent 1.6px);
    background-size: 36px 36px;
    pointer-events: none;
  }
  .accent-rule {
    height: 6px;
    background: #ffffff;
    transform-origin: left center;
    border-radius: 2px;
  }
  .step-num {
    font-weight: 900;
    font-size: 340px;
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: transparent;
    -webkit-text-stroke: 3px rgba(255,255,255,0.55);
  }
  .step-head {
    font-weight: 900;
    font-size: 96px;
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #ffffff;
  }
  .step-sub {
    font-weight: 500;
    font-size: 36px;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.82);
  }
  .badge {
    display: inline-block;
    background: #41597B;
    color: #ffffff;
    font-weight: 700;
    font-size: 32px;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    padding: 16px 36px;
    border-radius: 2px;
  }

  /* ---------- Beat A1 ---------- */
  #b01 .bg {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 130% 110% at 30% 20%, #41597B 0%, #2c4058 55%, #1F3647 100%);
  }
  #b01-logo {
    position: absolute;
    top: 70px;
    left: 90px;
    width: 180px;
  }
  #b01-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #b01-title {
    font-weight: 900;
    font-size: 150px;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #ffffff;
  }
  #b01-rule { width: 480px; margin: 44px 0 36px 0; }
  #b01-sub {
    font-weight: 400;
    font-size: 42px;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.85);
  }

  /* ---------- Beat A2 ---------- */
  #b02 { background: #1F3647; }
  #b02-photo-wrap {
    position: absolute;
    top: 0;
    right: 0;
    width: 900px;
    height: 1080px;
    overflow: hidden;
  }
  #b02-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #b02-photo-tint {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #1F3647 0%, rgba(31,54,71,0.72) 30%, rgba(31,54,71,0.30) 100%);
  }
  #b02-left {
    position: absolute;
    top: 0;
    left: 0;
    width: 1100px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 120px;
  }
  #b02-num { margin-bottom: -30px; margin-left: -8px; }
  #b02-rule { width: 220px; margin: 34px 0 40px 0; }
  #b02-badge-row { margin-top: 48px; }

  /* ---------- Beat A3 ---------- */
  #b03 { background: #1F3647; }
  #b03-photo-wrap {
    position: absolute;
    top: 120px;
    right: 100px;
    width: 940px;
    height: 840px;
    overflow: hidden;
    border-radius: 2px;
  }
  #b03-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #b03-left {
    position: absolute;
    top: 0;
    left: 0;
    width: 820px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 120px;
  }
  #b03-num { margin-bottom: -30px; margin-left: -8px; }
  #b03-rule { width: 220px; margin: 34px 0 40px 0; }

  /* ---------- Beat A4 ---------- */
  #b04 { background: #F4F4F4; }
  #b04-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: 860px;
    height: 1080px;
    overflow: hidden;
    background: #ffffff;
  }
  #b04-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #b04-left {
    position: absolute;
    top: 0;
    left: 0;
    width: 1060px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 120px;
    color: #1F3647;
  }
  #b04-num {
    font-weight: 900;
    font-size: 340px;
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: transparent;
    -webkit-text-stroke: 3px rgba(31,54,71,0.45);
    margin-bottom: -30px;
    margin-left: -8px;
  }
  #b04-head { color: #1F3647; }
  #b04-rule { width: 220px; background: #41597B; margin: 34px 0 40px 0; }
  #b04-formats { display: flex; gap: 20px; }
  .fmt {
    display: inline-block;
    background: #41597B;
    color: #ffffff;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.08em;
    padding: 14px 30px;
    border-radius: 2px;
  }

  /* ---------- Beat A5 ---------- */
  #b05 { background: #41597B; }
  #b05 .bg {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 120% 100% at 50% 35%, #4a6489 0%, #41597B 60%, #39538C 100%);
  }
  #b05-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #b05-logo { width: 420px; margin-bottom: 90px; }
  #b05-cta {
    display: inline-block;
    background: #ffffff;
    color: #41597B;
    font-weight: 900;
    font-size: 64px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 24px 64px;
    border-radius: 2px;
  }
  #b05-url-wrap { margin-top: 70px; display: inline-block; }
  #b05-url {
    font-weight: 500;
    font-size: 44px;
    letter-spacing: 0.16em;
    color: #ffffff;
  }
  #b05-underline {
    height: 5px;
    background: #ffffff;
    margin-top: 14px;
    transform-origin: left center;
    border-radius: 2px;
  }
</style>
</head>
<body>

<div
  id="video"
  data-composition-id="video"
  data-width="1920"
  data-height="1080"
  data-start="0"
  data-duration="15"
  style="position:relative;width:1920px;height:1080px;"
>

  <!-- Beat A1 — PASPORT STAVBY -->
  <div class="beat" id="b01">
    <div class="cam" id="b01-cam">
      <div class="bg"></div>
      <div class="grid-overlay" id="b01-grid"></div>
      <img id="b01-logo" src="capture/assets/panopro.png" alt="" data-layout-ignore />
      <div id="b01-center">
        <div id="b01-title">PASPORT STAVBY</div>
        <div class="accent-rule" id="b01-rule"></div>
        <div id="b01-sub">dokumentace skutečného stavu objektu</div>
      </div>
    </div>
  </div>

  <!-- Beat A2 — 01 · 3D LASEROVÉ SKENOVÁNÍ -->
  <div class="beat" id="b02">
    <div class="cam" id="b02-cam">
      <div id="b02-photo-wrap">
        <img id="b02-photo" src="capture/assets/web-2026-uvod-jak-vznika-pasport-skenova.jpg" alt="" />
        <div id="b02-photo-tint"></div>
      </div>
      <div id="b02-left">
        <div class="step-num" id="b02-num" data-layout-ignore>01</div>
        <div class="step-head" id="b02-head">3D LASEROVÉ<br>SKENOVÁNÍ</div>
        <div class="accent-rule" id="b02-rule"></div>
        <div id="b02-badge-row">
          <span class="badge" id="b02-badge">přesnost 5 mm</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Beat A3 — 02 · MRAČNO BODŮ -->
  <div class="beat" id="b03">
    <div class="cam" id="b03-cam">
      <div class="dots-overlay" id="b03-dots"></div>
      <div id="b03-photo-wrap">
        <img id="b03-photo" src="capture/assets/pasport-pointcloud-01-980x668.jpg" alt="" />
      </div>
      <div id="b03-left">
        <div class="step-num" id="b03-num" data-layout-ignore>02</div>
        <div class="step-head" id="b03-head">MRAČNO<br>BODŮ</div>
        <div class="accent-rule" id="b03-rule"></div>
        <div class="step-sub" id="b03-sub">digitální otisk reality</div>
      </div>
    </div>
  </div>

  <!-- Beat A4 — 03 · 3D MODEL + 2D VÝKRESY -->
  <div class="beat" id="b04">
    <div class="cam" id="b04-cam">
      <div id="b04-panel">
        <img id="b04-photo" src="capture/assets/reference3dmodel2dvykresy-pro.jpg" alt="" />
      </div>
      <div id="b04-left">
        <div id="b04-num" data-layout-ignore>03</div>
        <div class="step-head" id="b04-head">3D MODEL<br>+ 2D VÝKRESY</div>
        <div class="accent-rule" id="b04-rule"></div>
        <div id="b04-formats">
          <span class="fmt">.RVT</span>
          <span class="fmt">.IFC</span>
          <span class="fmt">.DWG</span>
          <span class="fmt">.PDF</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Beat A5 — CTA -->
  <div class="beat" id="b05">
    <div class="cam" id="b05-cam">
      <div class="bg"></div>
      <div class="grid-overlay" id="b05-grid"></div>
      <div id="b05-center">
        <img id="b05-logo" src="capture/assets/panopro-cta.png" alt="" />
        <div id="b05-cta">KALKULACE ZDARMA</div>
        <div id="b05-url-wrap">
          <div id="b05-url">panopro.cz</div>
          <div id="b05-underline"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  function el(id) { return document.getElementById(id); }

  var b01 = el("b01"), b02 = el("b02"), b03 = el("b03"), b04 = el("b04"), b05 = el("b05");
  if (!b01 || !b02 || !b03 || !b04 || !b05) { window.__timelines["video"] = tl; return; }

  /* ================= Beat A1 : 0 – 2.5 ================= */
  tl.fromTo(b01, { scale: 1.012 }, { scale: 1, duration: 0.25, ease: "power2.out" }, 0);
  tl.fromTo(el("b01-cam"), { scale: 1 }, { scale: 1.05, duration: 2.5, ease: "none" }, 0);
  tl.fromTo(el("b01-grid"), { x: 0, y: 0 }, { x: -42, y: -26, duration: 2.5, ease: "none" }, 0);
  tl.fromTo(el("b01-logo"), { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 0);
  tl.fromTo(el("b01-title"),
    { y: 40, scale: 0.96 },
    { y: 0, scale: 1, duration: 1.1, ease: "expo.out" }, 0);
  tl.fromTo(el("b01-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power4.out" }, 0.4);
  tl.fromTo(el("b01-sub"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 0.5);
  tl.set(b01, { opacity: 0 }, 2.5);

  /* ================= Beat A2 : 2.5 – 5.5 ================= */
  tl.set(b02, { opacity: 1 }, 2.5);
  tl.fromTo(b02, { scale: 1.012 }, { scale: 1, duration: 0.25, ease: "power2.out" }, 2.5);
  tl.fromTo(el("b02-photo"), { scale: 1.06 }, { scale: 1, duration: 3, ease: "none" }, 2.5);
  tl.fromTo(el("b02-num"), { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.8, ease: "power4.out" }, 2.5);
  tl.fromTo(el("b02-head"), { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, 2.6);
  tl.fromTo(el("b02-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power4.out" }, 2.85);
  tl.fromTo(el("b02-badge"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 3.1);
  tl.fromTo(el("b02-left"), { x: 0 }, { x: -14, duration: 1.6, ease: "none" }, 3.9);
  tl.set(b02, { opacity: 0 }, 5.5);

  /* ================= Beat A3 : 5.5 – 8.5 ================= */
  tl.set(b03, { opacity: 1 }, 5.5);
  tl.fromTo(b03, { scale: 1.012 }, { scale: 1, duration: 0.25, ease: "power2.out" }, 5.5);
  tl.fromTo(el("b03-dots"), { x: 0, y: 0 }, { x: 34, y: 20, duration: 3, ease: "none" }, 5.5);
  tl.fromTo(el("b03-photo-wrap"),
    { clipPath: "inset(0 100% 0 0)" },
    { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power4.out" }, 5.5);
  tl.fromTo(el("b03-photo"), { scale: 1 }, { scale: 1.07, duration: 3.0, ease: "none" }, 5.5);
  tl.fromTo(el("b03-num"), { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.8, ease: "power4.out" }, 5.5);
  tl.fromTo(el("b03-head"), { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, 5.6);
  tl.fromTo(el("b03-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power4.out" }, 5.85);
  tl.fromTo(el("b03-sub"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 6.05);
  tl.set(b03, { opacity: 0 }, 8.5);

  /* ================= Beat A4 : 8.5 – 11.5 ================= */
  tl.set(b04, { opacity: 1 }, 8.5);
  tl.fromTo(b04, { scale: 1.012 }, { scale: 1, duration: 0.25, ease: "power2.out" }, 8.5);
  tl.fromTo(el("b04-panel"), { x: 200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "power4.out" }, 8.5);
  tl.fromTo(el("b04-photo"), { scale: 1 }, { scale: 1.06, duration: 3.0, ease: "none" }, 8.5);
  tl.fromTo(el("b04-num"), { x: -70 }, { x: 0, duration: 0.8, ease: "power4.out" }, 8.5);
  tl.fromTo(el("b04-head"), { y: 44 }, { y: 0, duration: 0.8, ease: "power4.out" }, 8.5);
  tl.fromTo(el("b04-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power4.out" }, 8.85);
  tl.fromTo(document.querySelectorAll("#b04-formats .fmt"),
    { opacity: 0, y: 30 },
    { opacity: 1, y: 0, duration: 0.6, ease: "power4.out", stagger: 0.1 }, 9.05);
  tl.set(b04, { opacity: 0 }, 11.5);

  /* ================= Beat A5 : 11.5 – 15 ================= */
  tl.set(b05, { opacity: 1 }, 11.5);
  tl.fromTo(b05, { scale: 1.012 }, { scale: 1, duration: 0.25, ease: "power2.out" }, 11.5);
  tl.fromTo(el("b05-cam"), { scale: 1 }, { scale: 1.04, duration: 3.5, ease: "none" }, 11.5);
  tl.fromTo(el("b05-grid"), { x: 0, y: 0 }, { x: -30, y: -18, duration: 3.5, ease: "none" }, 11.5);
  tl.fromTo(el("b05-logo"), { opacity: 0, y: -34 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 11.5);
  tl.fromTo(el("b05-cta"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 11.8);
  tl.fromTo(el("b05-url"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 12.2);
  tl.fromTo(el("b05-underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power4.out" }, 12.45);

  window.__timelines["video"] = tl;
})();
</script>

</body>
</html>
